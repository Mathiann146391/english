<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apprentissage de l'anglais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <section class="buttons" aria-label="Choix de catégorie">
            <button class="button" id="allButton" type="button">Maths</button>
            <button class="button" id="weekButton" type="button">Anglais</button>
        </section>

        <section class="card-container" aria-live="polite">
            <div class="card" id="card" role="button" tabindex="0" aria-label="Carte de vocabulaire. Cliquez pour retourner.">
                <div class="card-content front" id="front">Cliquez pour commencer</div>
                <div class="card-content back" id="back" aria-hidden="true"></div>
            </div>
        </section>

        <button class="button" id="nextButton" type="button">Changer le mot</button>
    </main>

    <script src="script.js" defer></script>
</body>
</html>
